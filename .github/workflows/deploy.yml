name: Deploy to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install function deps
        run: cd functions && npm install --no-audit --no-fund
      - name: Deploy
        run: npx --yes firebase-tools@14 deploy --only hosting,functions,database --project vvdouble-shopline --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
