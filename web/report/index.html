<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>門市回報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F5F7;color:#1F2430;font-family:'Noto Sans TC',system-ui,sans-serif;font-size:12.5px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 40px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:16px}
.sub{color:#5B6472}
.card{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ttl{font-weight:700}
.big{font-size:17px;font-weight:700}
.num b{font-size:13.5px;color:#1F2430}
.row{display:flex;align-items:center;gap:12px}
.row label{flex:1 1 0;min-width:0}
.row.money label{color:#5B6472}
input[type=text],input[type=date]{font-family:inherit;height:40px;border:1px solid #D5D9E0;border-radius:8px;padding:0 10px;font-size:16px;color:#1F2430;background:#fff}
@media (min-width:600px){input[type=text],input[type=date]{font-size:13.5px;height:36px}}
.money input{flex:none;width:140px;text-align:right}
.qty input{flex:none;width:64px;text-align:center;padding:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.two>div{display:flex;flex-direction:column;gap:6px}
.two input{width:100%}
.chip{align-self:flex-start;padding:3px 10px;border-radius:999px;background:#EEF0F3}
.msg{padding:12px 14px;border-radius:12px;font-weight:500;display:none}
.evtop{display:flex;justify-content:flex-end}
.seg{display:inline-flex;background:#E9ECF0;border-radius:999px;padding:3px}
.seg button{font-family:inherit;font-size:12px;border:0;background:none;color:#1F2430;padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:#1F2430;color:#fff}
.cal{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.wk{display:flex;gap:6px}.wl{flex:none;width:30px;font-size:11.5px;color:#5B6472;padding-top:6px}
.wgrid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:5px}
.dh{text-align:center;padding:4px 0 6px;border-bottom:1px solid #E9ECF0}
.dh span{display:block;font-size:11px;color:#5B6472}.dh b{font-size:13.5px;font-weight:500}
.dh.we span,.dh.we b{color:#9B1C12}.dh.today b{background:#1F2430;color:#fff;border-radius:999px;padding:1px 7px}
.evbar{font-family:inherit;font-size:11.5px;font-weight:500;text-align:left;border:0;cursor:pointer;min-height:26px;padding:4px 8px;margin:0 2px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evbar.c0{background:#1F2430;color:#fff}.evbar.c1{background:#DCE6F7;color:#1F3A6E}.evbar.c2{background:#E6F4EC;color:#17633A}.evbar.c3{background:#F3E8D2;color:#6B4A12}
.evnext{font-size:12px;color:#5B6472;border-top:1px solid #E9ECF0;padding-top:8px}
.evitem{background:#fff;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.evitem.sel{outline:2px solid #1F2430}
.evitem .n{font-weight:700;font-size:13.5px}.evitem .d{color:#5B6472}.evitem .mech{line-height:1.6;white-space:pre-line}
.evchips{display:flex;flex-wrap:wrap;gap:4px}
.evchips span{font-size:11px;padding:2px 9px;border-radius:999px;background:#EEF0F3}
.evchips span.k{background:#1F2430;color:#fff}.evchips span.g{background:#E6F4EC;color:#17633A}.evchips span.r{background:#FDE8E6;color:#9B1C12}
.evnote{background:#FFF4CC;border-radius:8px;padding:8px 10px;line-height:1.55;white-space:pre-line}
.msg.ok{background:#E6F4EC;color:#17633A}
.msg.err{background:#FDE8E6;color:#9B1C12}
.msg.info{background:#EEF0F3;color:#1F2430}
button.primary{font-family:inherit;height:46px;border:0;border-radius:10px;background:#1F2430;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
details.sec{background:#E9EBEF;border-radius:14px;padding:0}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;font-weight:700;font-size:13.5px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .r{display:flex;align-items:center;gap:8px;font-weight:500;color:#4A5261}
details.sec>summary svg{transition:transform .15s}
details.sec[open]>summary svg{transform:rotate(180deg)}
.secbody{display:flex;flex-direction:column;gap:10px;padding:0 8px 8px}
button.primary:disabled{background:#8A93A3;cursor:default}
.file{font-family:inherit;font-size:13px}
button.ghost{font-family:inherit;align-self:flex-start;height:40px;padding:0 14px;border:1px solid #D5D9E0;border-radius:8px;background:#fff;color:#1F2430;font-size:13px;cursor:pointer}
.prow{display:grid;grid-template-columns:100px minmax(0,1fr) 100px 40px;gap:8px;align-items:center}
.prow input{width:100%;min-width:0}
.prow button{font-family:inherit;height:40px;border:1px solid #D5D9E0;border-radius:8px;background:#fff;color:#5B6472;cursor:pointer;display:flex;align-items:center;justify-content:center}
@media (max-width:520px){.prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}.prow .p-note{grid-column:1 / -1;grid-row:1}}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:8px;align-items:center}
.rrow input{width:100%;min-width:0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:8px;align-items:center}
.prow .pk{display:flex;gap:6px;min-width:0}
.prow select,.prow input{font-family:inherit;width:100%;min-width:0;height:40px;border:1px solid #D5D9E0;border-radius:8px;padding:0 8px;font-size:16px;color:#1F2430;background:#fff}
.prow .p-amt{text-align:right}
@media (min-width:600px){.prow select,.prow input{font-size:13.5px}}
.prow button{font-family:inherit;height:40px;border:1px solid #D5D9E0;border-radius:8px;background:#fff;color:#5B6472;cursor:pointer;display:flex;align-items:center;justify-content:center}
.plist{display:flex;flex-direction:column;gap:8px}
.pblock{display:flex;flex-direction:column;gap:8px}
.pblock .ph{display:flex;justify-content:space-between;align-items:baseline;color:#5B6472}
.rrow button{font-family:inherit;height:40px;border:1px solid #D5D9E0;border-radius:8px;background:#fff;color:#5B6472;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:inherit;font-size:12.5px;min-height:34px;padding:0 13px;border:0;border-radius:999px;background:#EEF0F3;color:#1F2430;cursor:pointer}
.chips button[aria-pressed=true]{background:#1F2430;color:#fff;font-weight:500}
.grp{display:flex;flex-direction:column;gap:6px}
.grp .lab{color:#5B6472}
.full{width:100%}
textarea{font-family:inherit;width:100%;min-height:72px;border:1px solid #D5D9E0;border-radius:8px;padding:8px 10px;font-size:16px;color:#1F2430;resize:vertical}
@media (min-width:600px){textarea{font-size:13.5px}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv>div{display:flex;flex-direction:column}
.kv .k{color:#5B6472;font-size:12px}
.kv .v{font-size:15px;font-weight:700}
.bar{height:8px;border-radius:999px;background:#EEF0F3;overflow:hidden}
.bar>i{display:block;height:100%;background:#1F2430;border-radius:999px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:6px 4px;text-align:right;border-bottom:1px solid #EEF0F3;white-space:nowrap}
table.t th{font-weight:500;color:#5B6472;font-size:12px}
table.t th:first-child,table.t td:first-child{text-align:left}
.scroll{overflow-x:auto}
.neg{color:#9B1C12}.pos{color:#17633A}
#thumb{max-width:180px;border-radius:8px;display:none}
.meta{color:#5B6472;font-size:12px;word-break:break-all}
#form{display:none;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>門市回報</h1>
    <div class="sub" id="storeName"></div>
  </div>

  <div class="msg info" id="info">載入中</div>
  <div class="msg ok" id="ok"></div>
  <div class="msg err" id="err"></div>

  <div id="form">
    <details class="sec" id="secEv" open>
      <summary><span>活動</span><span class="r"><span id="evSum"></span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></summary>
      <div class="secbody">
        <div class="evtop" id="evTop" style="display:none"><div class="seg"><button type="button" id="evCalBtn" aria-pressed="true">週曆</button><button type="button" id="evListBtn" aria-pressed="false">清單</button></div></div>
        <div class="cal" id="evCal" style="display:none"></div>
        <div id="evList" style="display:flex;flex-direction:column;gap:8px"><div class="sub" id="evMsg">載入中</div></div>
      </div>
    </details>
    <details class="sec" open>
      <summary><span>今日回報</span><span class="r"><span id="sumDaily">$0</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></summary>
      <div class="secbody">
    <div class="card">
      <div class="two">
        <div><label class="ttl" for="date">日期</label><input type="date" id="date"></div>
        <div><label class="ttl" for="who">回報人</label><input type="text" id="who" autocomplete="off" maxlength="30"></div>
      </div>
    </div>

    <div class="card">
      <div class="head"><div class="ttl">總業績</div><div class="big" id="total">$0</div></div>
      <div class="row money"><label for="cash">現金</label><input type="text" inputmode="numeric" id="cash" data-n></div>
      <div class="row money"><label for="card">刷卡</label><input type="text" inputmode="numeric" id="card" data-n></div>
      <div class="row money" data-street><label for="linepay">LINE Pay</label><input type="text" inputmode="numeric" id="linepay" data-n></div>
      <div class="row money" data-dept><label for="voucherE">電子抵用券</label><input type="text" inputmode="numeric" id="voucherE" data-n></div>
      <div class="row money" data-dept><label for="voucherG">商品抵用券</label><input type="text" inputmode="numeric" id="voucherG" data-n></div>
      <div class="pblock" data-deptblock>
        <div class="ph"><span>行動支付</span><b class="num" id="mobileSum">$0</b></div>
        <div class="plist" id="mobileList"></div>
        <button class="ghost" type="button" id="mobileAdd">新增行動支付</button>
      </div>
      <div class="pblock" data-deptblock>
        <div class="ph"><span>其他支付</span><b class="num" id="otherSum">$0</b></div>
        <div class="plist" id="otherList"></div>
        <button class="ghost" type="button" id="otherAdd">新增其他支付</button>
      </div>
    </div>

    <div class="card">
      <div class="head"><div class="ttl">來客</div><div class="sub num">來客數 <b id="cust">0</b>　客單 <b id="avg">—</b></div></div>
      <div class="row money"><label for="mem">會員</label><input type="text" inputmode="numeric" id="mem" data-n></div>
      <div class="row money"><label for="non">非會員</label><input type="text" inputmode="numeric" id="non" data-n></div>
      <div class="row money"><label for="pieces">件數</label><input type="text" inputmode="numeric" id="pieces" data-n></div>
    </div>

    <div class="card">
      <div class="head"><div class="ttl">銷退</div><div class="big" id="retSum" style="display:none">$0</div></div>
      <div id="rets" style="display:none;flex-direction:column;gap:10px"></div>
      <button class="ghost" id="retAdd" type="button">有銷退</button>
    </div>

    <div class="card">
      <div class="head"><div class="ttl">現金月結</div><div class="sub num">應投庫 <b id="depExp">$0</b>　差額 <b id="depDiff">—</b></div></div>
      <div class="row money"><label for="deposit">實際投庫</label><input type="text" inputmode="numeric" id="deposit"></div>
    </div>

    <div class="card" id="itemsCard">
      <div class="ttl">滯銷</div>
      <div id="items" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>

    <div class="card">
      <label class="ttl" for="photo">日結畫面</label>
      <input class="file" type="file" id="photo" accept="image/*">
      <img id="thumb" alt="已選的照片">
    </div>

      </div>
    </details>

    <details class="sec">
      <summary><span>零用金</span><span class="r"><span id="pettySum">$0</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></summary>
      <div class="secbody">
    <div class="card">
      <div id="petty" style="display:flex;flex-direction:column;gap:10px"></div>
      <button class="ghost" id="pettyAdd" type="button">新增一筆</button>
    </div>

      </div>
    </details>

    <details class="sec" id="secScene">
      <summary><span>現場狀況</span><span class="r"><span id="sceneSum"></span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></summary>
      <div class="secbody">
    <div class="card">
      <div class="grp"><div class="lab">人潮</div><div class="chips" data-g="crowd"></div></div>
      <div class="grp"><div class="lab">客群</div><div class="chips" data-g="customer"></div></div>
      <div class="grp"><div class="lab">熱銷類別（可複選）</div><div class="chips" data-g="hot" data-multi></div></div>
      <div class="grp"><div class="lab">商品狀態</div><div class="chips" data-g="stock"></div></div>
      <div class="grp"><div class="lab">試穿轉換</div><div class="chips" data-g="tryc"></div></div>
      <div class="grp"><label class="lab" for="sceneNote">補充</label><input class="full" type="text" id="sceneNote" maxlength="200" autocomplete="off"></div>
      <div class="grp"><label class="lab" for="specialNote">特別狀況</label><textarea id="specialNote" maxlength="500"></textarea></div>
    </div>
      </div>
    </details>

    <button class="primary" id="send" type="button">送出回報</button>

    <details class="sec" id="secProg">
      <summary><span>本月進度</span><span class="r"><span id="progSum"></span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></summary>
      <div class="secbody">
    <div class="card" id="progCard"><div class="sub" id="progMsg">載入中</div></div>
    <div class="card" id="allCard" style="display:none"></div>
      </div>
    </details>
  </div>

  <div class="meta" id="meta"></div>
  <div id="hqBox" style="display:none;flex-wrap:wrap;gap:8px">
    <select id="testStore" aria-label="測試用門市" style="font-family:inherit;font-size:13px;height:40px;border:1px solid #D5D9E0;border-radius:8px;padding:0 8px;background:#fff;color:#1F2430"></select>
    <button class="ghost" id="testCard" type="button">發測試回報卡片</button>
    <button class="ghost" id="testOpen" type="button">發測試開店提醒</button>
  </div>
</div>

<script src="teams.min.js"></script>
<script>
(function () {
  var API = 'https://asia-east1-vvdouble-shopline.cloudfunctions.net/report';
  var STORES = { zhongxiao: '台北忠孝旗艦', tongyi: '統一門市', taoyuan: '桃園 ATT', yizhong: '一中門市', xinyizhong: '台中新一中', xintiandi: '台南門市', xinjuejiang: '高雄門市' };
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var store = STORES[qs.get('store')] ? qs.get('store') : '';
  var items = [];
  var photoData = '';
  var busy = false;
  var PAYKEYS = ['cash', 'card', 'linepay', 'voucherE', 'voucherG'];
  var PAY_OPTS = { mobile: ['LINE PAY', 'ICP', '悠遊付', 'PAYEASY', '愛金卡', 'Pi 錢包', '街口支付', '台灣 Pay', 'SKM PAY', 'LINE PAY MONEY', '台新 PAY'], other: ['7-11 禮券', '商品禮券', '限定優惠券', '即享抵用券', '一點一元', '一點兩元', '點數活動', '會員點數', '會員折抵', 'APP 抵用', '銀角零卡', '其他'] };
  var DEPT_DEFAULT = ['tongyi', 'taoyuan', 'xintiandi'];
  // 依門市類型顯示付款欄位（先用內建名單畫，載入設定後以後端名單為準）
  function applyStoreType(list) {
    var dept = (list || DEPT_DEFAULT).indexOf(store) >= 0;
    Array.prototype.forEach.call(document.querySelectorAll('[data-dept]'), function (el) { el.style.display = dept ? 'flex' : 'none'; if (!dept) el.querySelector('input').value = ''; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-deptblock]'), function (el) { el.style.display = dept ? 'flex' : 'none'; if (!dept) { el.querySelector('.plist').textContent = ''; } });
    paySum();
    Array.prototype.forEach.call(document.querySelectorAll('[data-street]'), function (el) { el.style.display = dept ? 'none' : 'flex'; if (dept) el.querySelector('input').value = ''; });
  }
  var VER = 'v1.11';

  function show(id, text) {
    ['info', 'ok', 'err'].forEach(function (k) { $(k).style.display = 'none'; });
    if (id) { $(id).textContent = text; $(id).style.display = 'block'; }
  }
  function today() {
    var d = new Date(Date.now() + 8 * 3600000);
    return d.toISOString().slice(0, 10);
  }
  var n = function (el) { return parseInt(el.value, 10) || 0; };
  var money = function (v) { return '$' + Math.round(v).toLocaleString('en-US'); };

  // 只改數字顯示的文字，不重畫輸入框，所以打字不會跳掉
  function recalc() {
    var total = PAYKEYS.reduce(function (a, k) { return a + n($(k)); }, 0) + listSum('mobile') + listSum('other');
    var cust = n($('mem')) + n($('non'));
    $('total').textContent = money(total);
    $('sumDaily').textContent = money(total);
    $('cust').textContent = String(cust);
    $('avg').textContent = cust > 0 ? money(total / cust) : '—';
    depCalc();
  }
  // 現金月結：應投庫＝今日現金業績；實際投庫沒填就不算差額
  function depCalc() {
    var exp = n($('cash'));
    $('depExp').textContent = money(exp);
    var el = $('depDiff');
    if ($('deposit').value === '') { el.textContent = '—'; el.className = ''; return; }
    var d = n($('deposit')) - exp;
    el.textContent = d === 0 ? '$0' : (d > 0 ? '+' : '-') + money(Math.abs(d));
    el.className = d === 0 ? '' : (d > 0 ? 'pos' : 'neg');
  }
  // 百貨店的行動支付／其他支付：一筆一列，選種類＋金額；只增刪那一列，不重畫
  function listSum(t) {
    var sum = 0;
    Array.prototype.forEach.call(document.querySelectorAll('#' + t + 'List .p-amt'), function (a) { sum += n(a); });
    return sum;
  }
  function paySum() {
    ['mobile', 'other'].forEach(function (t) { $(t + 'Sum').textContent = money(listSum(t)); });
    recalc();
  }
  function addPay(t) {
    var row = document.createElement('div'); row.className = 'prow';
    var wrap = document.createElement('div'); wrap.className = 'pk';
    var sel = document.createElement('select'); sel.className = 'p-key'; sel.setAttribute('aria-label', (t === 'mobile' ? '行動支付' : '其他支付') + '種類');
    var first = document.createElement('option'); first.value = ''; first.textContent = '選擇種類'; sel.appendChild(first);
    PAY_OPTS[t].forEach(function (o) { var op = document.createElement('option'); op.value = o; op.textContent = o === '其他' ? '其他（自己填名稱）' : o; sel.appendChild(op); });
    var name = document.createElement('input'); name.type = 'text'; name.className = 'p-name'; name.placeholder = '名稱'; name.maxLength = 20; name.autocomplete = 'off'; name.setAttribute('aria-label', '其他支付名稱'); name.style.display = 'none';
    sel.addEventListener('change', function () { var c = sel.value === '其他'; name.style.display = c ? 'block' : 'none'; if (!c) name.value = ''; else name.focus(); });
    var amt = document.createElement('input'); amt.type = 'text'; amt.className = 'p-amt'; amt.placeholder = '金額'; amt.inputMode = 'numeric'; amt.setAttribute('aria-label', '金額');

  function loadEvents() {
    getJson('op=events').then(function (j) { renderEvents(j.events || [], j.today); })
      .catch(function () { var b = $('evList'); b.textContent = ''; b.appendChild(el('div', 'sub', '活動讀取失敗，請稍後重新開啟')); });
  }
  function start() {
    if (!store) { show('err', '這個分頁還沒設定門市，請總部重新加入分頁'); return; }
    $('storeName').textContent = STORES[store];
    $('date').value = today(); $('date').max = today();
    applyStoreType();
    if (!window.microsoftTeams) { show('err', '請從 Teams 的「門市回報」分頁開啟'); return; }
    var stage = '啟動';
    var withTimeout = function (pr, ms) { return Promise.race([pr, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('逾時')); }, ms); })]); };
    withTimeout(microsoftTeams.app.initialize(), 15000).then(function () {
      try { microsoftTeams.app.notifySuccess(); } catch (e) {}
      stage = '身分驗證';
      return withTimeout(token(), 20000);
    }).then(function (t) {
      stage = '連線';
      return fetch(API + '?op=config', { headers: { Authorization: 'Bearer ' + t } });
    }).then(function (r) { stage = '讀取設定'; return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error || '載入失敗');
      renderItems(j.items);
      if (j.payOpts && j.payOpts.mobile && j.payOpts.other) PAY_OPTS = j.payOpts;
      applyStoreType(j.dept);
      $('meta').textContent = (j.account || '') + '　' + VER;
      show(null);
      $('form').style.display = 'flex';
      if (j.hq) { isHq = true; $('hqBox').style.display = 'flex'; }
      loadEvents();
    }).catch(function (e) {
      var raw = String((e && (e.message || e.errorCode)) || e || '');
      show('err', stage + '沒有成功，請關掉分頁重新開啟');
      $('meta').textContent = VER + '　' + stage + '：' + raw.slice(0, 160);
    });
  }
  start();
})();
</script>
</body>
</html>
